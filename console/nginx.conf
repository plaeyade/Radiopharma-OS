# Radiopharma OS Console - SPA + proxy same-origin a los 6 microservicios.
# La consola llama a /dl/api/... y nginx lo reenvía al servicio correspondiente,
# eliminando CORS y configuración de URLs en el despliegue.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Microservicios (los nombres son los del docker-compose)
    location /nds/  { proxy_pass http://nuclear-data-service:8001/; }
    location /ye/   { proxy_pass http://yield-engine:8002/; }
    location /dl/   { proxy_pass http://data-lake-service:8003/; }
    location /auth/ { proxy_pass http://auth-service:8004/; }
    location /qc/   { proxy_pass http://qc-engine:8005/; }
    location /tel/  { proxy_pass http://telemetry-service:8006/; }

    # cabeceras estándar de proxy
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
}
