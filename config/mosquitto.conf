# Radiopharma OS — broker MQTT de desarrollo (EDS cap. 31 RTMSIL)
# DESARROLLO: acceso anónimo solo dentro de la red docker/local.
# PRODUCCIÓN: exigir autenticación (password_file) y TLS (certfile/keyfile)
# conforme a la política Zero Trust del cap. 48 — el broker del acelerador
# vive en la red OT segmentada.
listener 1883
protocol mqtt

listener 9002
protocol websockets

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
