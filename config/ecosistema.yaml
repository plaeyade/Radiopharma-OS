# Repos hermanos de radiopharma-os (todos privados, plaeyade). Las rutas locales se fijan con variables de entorno.
gamma_ai:      {rol: plataforma maestra (clínica, pacientes, dosimetría, literatura), repo: "pendiente"}
cyclotron_sim: {rol: modelo CAD/físico del ciclotrón, repo: plaeyade/Cyclotron-SIM, env: CYCLOTRON_SIM_RAIZ,
                contrato: "machines/<maquina>/export/termino_fuente.json (cyclotron-sim/termino_fuente@1)"}
zumaya_ai:     {rol: proyecto de instalación (blindajes, estructura, documentos), repo: plaeyade/Zumaya-AI, env: ZUMAYA_RAIZ,
                contrato: "licencia/presupuesto_operativo.json (corriente máx., µA·h/semana autorizados)"}
radshieldmx:   {rol: cálculo analítico de blindajes, repo: plaeyade/RadShieldMx, validacion: "contra MC de Cyclotron-SIM y casos Zumaya"}
